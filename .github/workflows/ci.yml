name: ci

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'Makefile'
      - 'scripts/**'
      - '.github/workflows/**'

jobs:
  selftest-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake libcurl4-openssl-dev
      - name: Build
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=g++ && cmake --build build -j"$(nproc)"
      - name: Self-test
        run: ./build/11dim-ai-test --self-test

  selftest-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure cmake
        run: command -v cmake >/dev/null 2>&1 || brew install cmake
      - name: Build
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ && cmake --build build -j"$(sysctl -n hw.ncpu)"
      - name: Self-test
        run: ./build/11dim-ai-test --self-test
